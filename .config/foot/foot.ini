# -*- conf -*-

font=Ioskeley Mono:style=Regular:size=15, Symbols Nerd Font Mono:size=15, Noto Color Emoji:size=15
pad=5x5
resize-delay-ms=100

[url]
launch=xdg-open ${url}
# Underlines standard URLs automatically
# osc8-underline=always

[cursor]
style=block

[mouse]
hide-when-typing=yes

[colors]
cursor=11111b f5e0dc
background=111111
foreground=dddddd

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

16=fab387
17=f5e0dc

selection-foreground=cdd6f4
selection-background=414356

search-box-no-match=11111b f38ba8
search-box-match=cdd6f4 313244

jump-labels=11111b fab387
urls=89b4fa

[key-bindings]
# First, disable the default unicode-input to stop the conflict
unicode-input=none
# Now assign the URL launcher to that shortcut
show-urls-launch=Control+Shift+u

[mouse-bindings]
# Allows using Shift to bypass apps (like Vim) for selection/URLs
selection-override-modifiers=Shift

primary-paste=BTN_MIDDLE
select-begin=BTN_LEFT
select-begin-block=Control+BTN_LEFT
select-extend=BTN_RIGHT
select-extend-character-wise=Control+BTN_RIGHT
select-word=BTN_LEFT-2
select-word-whitespace=Control+BTN_LEFT-2
# We omit BTN_LEFT-3 (triple click) to avoid the select-quote conflict
