# These settings were set by the catalyst build script that automatically
# built this stage.
# Please consult /usr/share/portage/config/make.conf.example for a more
# detailed example.
COMMON_FLAGS="-O2 -march=znver3 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

USE="elogind -systemd wayland -bluetooth flatpak dbus networkmanager pipewire pulseaudio screencast gstreamer dist-kernel"


# For Secure Boot put these flags
#secureboot modules-sign

# Secure Boot Keys 
# SECUREBOOT_KEY="/etc/efikeys/db.key"
# SECUREBOOT_CERT="/etc/efikeys/db.crt"

# DistClean
DARKELF_FEATURES="postmerge_distclean"

#QEMU
QEMU_SOFTMMU_TARGETS="x86_64" QEMU_USER_TARGETS="x86_64"

#Compression
# PORTAGE_COMPRESS="zstd"
# BINPKG_COMPRESS="zstd"

# BINPKG_COMPRESS_FLAGS_ZSTD flags:
# * -T0 (already the default but adding here so it's not lost)
# * -22: maximum compression level
# * --ultra: work harder
# BINPKG_COMPRESS_FLAGS_ZSTD="-T0 -19 --ultra"


MAKEOPTS="-j6"
VIDEO_CARDS="amdgpu radeonsi nvidia"
FEATURES="candy parallel-fetch parallel-install"
# Overrides the profile's ACCEPT_LICENSE default value
ACCEPT_LICENSE="*"
# Appending getbinpkg to the list of values within the FEATURES variable
FEATURES="${FEATURES} getbinpkg"
# Require signatures
FEATURES="${FEATURES} binpkg-request-signature"
#
# NOTE: This stage was built with the bindist Use flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.utf8
GRUB_PLATFORMS="efi-64"




GENTOO_MIRRORS="https://in.mirrors.cicku.me/gentoo/ \
    https://mirrors.nxtgen.com/gentoo-mirror/gentoo-source/ \
    https://gentoo.mirrors.ovh.net/gentoo-distfiles/ \
    https://ariel.in.ext.planetunix.net/pub/gentoo/"
